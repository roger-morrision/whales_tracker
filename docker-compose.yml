version: '3.8'

services:
  # TimescaleDB for historical data warehouse
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: whales-tracker-timescaledb
    environment:
      POSTGRES_DB: whales_tracker
      POSTGRES_USER: whales_tracker
      POSTGRES_PASSWORD: ${TIMESCALE_PASSWORD:-whales_tracker_dev_password}
      # TimescaleDB tuning
      TIMESCALEDB_TELEMETRY: 'off'
    ports:
      - "5432:5432"
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
      - ./scripts/init-timescaledb.sql:/docker-entrypoint-initdb.d/init-timescaledb.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U whales_tracker -d whales_tracker"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G

  # Redis for caching and rate limiting
  redis:
    image: redis:7-alpine
    container_name: whales-tracker-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Main Next.js application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: whales-tracker-app
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://whales_tracker:${TIMESCALE_PASSWORD:-whales_tracker_dev_password}@timescaledb:5432/whales_tracker
      REDIS_URL: redis://redis:6379
      # External APIs
      HELIUS_API_KEY: ${HELIUS_API_KEY}
      QUICKNODE_RPC_URL: ${QUICKNODE_RPC_URL}
      GMGN_API_KEY: ${GMGN_API_KEY}
      # Optional: Sentry
      SENTRY_DSN: ${SENTRY_DSN}
    ports:
      - "3000:3000"
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  # Nginx reverse proxy (optional, for production)
  nginx:
    image: nginx:alpine
    container_name: whales-tracker-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - app
    restart: unless-stopped

  # Background worker for data ingestion
  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: whales-tracker-worker
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://whales_tracker:${TIMESCALE_PASSWORD:-whales_tracker_dev_password}@timescaledb:5432/whales_tracker
      REDIS_URL: redis://redis:6379
      HELIUS_API_KEY: ${HELIUS_API_KEY}
      QUICKNODE_RPC_URL: ${QUICKNODE_RPC_URL}
      GMGN_API_KEY: ${GMGN_API_KEY}
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

volumes:
  timescaledb_data:
    driver: local
  redis_data:
    driver: local

networks:
  default:
    name: whales-tracker-network